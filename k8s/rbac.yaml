apiVersion: v1
kind: ServiceAccount
metadata:
  name: remolt-server
  namespace: remolt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remolt-pod-manager
  namespace: remolt
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remolt-pod-manager-binding
  namespace: remolt
subjects:
  - kind: ServiceAccount
    name: remolt-server
    namespace: remolt
roleRef:
  kind: Role
  name: remolt-pod-manager
  apiGroup: rbac.authorization.k8s.io
---
# Operator role — monitoring and cleanup, no exec into sandbox pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remolt-operator
  namespace: remolt
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list"]
