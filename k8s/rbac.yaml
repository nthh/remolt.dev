apiVersion: v1
kind: ServiceAccount
metadata:
  name: remolt-server
  namespace: remolt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remolt-pod-manager
  namespace: remolt
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remolt-pod-manager-binding
  namespace: remolt
subjects:
  - kind: ServiceAccount
    name: remolt-server
    namespace: remolt
roleRef:
  kind: Role
  name: remolt-pod-manager
  apiGroup: rbac.authorization.k8s.io
