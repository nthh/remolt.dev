apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remolt-data
  namespace: remolt
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remolt-server
  namespace: remolt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remolt-server
  template:
    metadata:
      labels:
        app: remolt-server
    spec:
      serviceAccountName: remolt-server
      containers:
        - name: server
          image: ghcr.io/nthh/remolt-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: remolt-auth
                optional: true
          env:
            - name: REMOLT_SANDBOX_IMAGE
              value: ghcr.io/nthh/remolt-sandbox:latest
            - name: REMOLT_MAX_SESSIONS
              value: "20"
            - name: REMOLT_MAX_IDLE_SECONDS
              value: "3600"
            - name: REMOLT_WARM_POOL
              value: "2"
            - name: REMOLT_EVENTS_LOG
              value: /data/events.jsonl
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remolt-data
---
apiVersion: v1
kind: Service
metadata:
  name: remolt-server
  namespace: remolt
spec:
  selector:
    app: remolt-server
  ports:
    - port: 8080
      targetPort: 8080
