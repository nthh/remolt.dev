apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: remolt
stringData:
  token: REPLACE_ME  # terraform output -raw tunnel_token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: remolt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
