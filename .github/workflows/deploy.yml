name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'container/**'
      - 'app/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: nthh

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn httpx websockets aiodocker cryptography pytest pytest-asyncio
      - run: pytest tests/ -v

  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'app/**'
              - 'Dockerfile'
            sandbox:
              - 'container/**'

  build:
    needs: [test, changes]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: server
            dockerfile: Dockerfile
            context: .
            changed: ${{ needs.changes.outputs.server }}
          - service: sandbox
            dockerfile: container/Dockerfile
            context: container
            changed: ${{ needs.changes.outputs.sandbox }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.sandbox == 'true'

    steps:
      - if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-${{ matrix.service }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [test, changes, build]
    if: ${{ always() && needs.test.result == 'success' && needs.changes.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: azure/setup-kubectl@v4

      - run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - run: kubectl apply -f k8s/

      - run: |
          if [[ "${{ needs.changes.outputs.server }}" == "true" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kubectl -n remolt set image deployment/remolt-server \
              server=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-server:${{ github.sha }}
            kubectl -n remolt rollout status deployment/remolt-server --timeout=300s
          fi

  bump-version:
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        run: |
          version=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$version"
          new_version="$major.$minor.$((patch + 1))"
          echo "$new_version" > VERSION
          echo "Bumped $version -> $new_version"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $(cat VERSION) [skip ci]"
          git push
