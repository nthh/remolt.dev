name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'container/**'
      - 'agents/**'
      - 'app/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: nthh

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn httpx websockets aiodocker cryptography pytest pytest-asyncio
      - run: pytest tests/ -v

  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      base: ${{ steps.filter.outputs.base }}
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'app/**'
              - 'Dockerfile'
            base:
              - 'container/Dockerfile.base'
              - 'container/entrypoint.sh'
            agents:
              - 'agents/**'
              - 'container/Dockerfile.agent'
              - 'container/Dockerfile.base'
              - 'container/entrypoint.sh'

  # Build the shared base image
  build-base:
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile.base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-sandbox-base:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-sandbox-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  # Discover agents and build their images
  discover-agents:
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: |
          MATRIX="["
          FIRST=true
          for agent_json in agents/*/agent.json; do
            AGENT_DIR=$(dirname "$agent_json")
            AGENT_ID=$(jq -r '.id' "$agent_json")
            AGENT_INSTALL=$(jq -r '.install // ""' "$agent_json")
            HAS_INSTALL_SH=false
            if [ -f "$AGENT_DIR/install.sh" ] && [ -s "$AGENT_DIR/install.sh" ]; then
              HAS_INSTALL_SH=true
            fi
            if [ "$FIRST" = true ]; then FIRST=false; else MATRIX+=","; fi
            MATRIX+="{\"id\":\"$AGENT_ID\",\"install\":\"$AGENT_INSTALL\",\"dir\":\"$AGENT_DIR\",\"has_install_sh\":$HAS_INSTALL_SH}"
          done
          MATRIX+="]"
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  build-agents:
    needs: [test, changes, build-base, discover-agents]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.discover-agents.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discover-agents.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare install.sh — create empty file if agent doesn't have one
      - run: |
          if [ "${{ matrix.has_install_sh }}" = "true" ]; then
            cp ${{ matrix.dir }}/install.sh container/install.sh
          else
            touch container/install.sh
          fi

      - uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile.agent
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-sandbox-base:latest
            AGENT_INSTALL=${{ matrix.install }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-${{ matrix.id }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-${{ matrix.id }}:latest
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

  # Build the server image
  build-server:
    needs: [test, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-server:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    needs: [test, changes, build-base, build-agents, build-server]
    if: ${{ always() && needs.test.result == 'success' && needs.changes.result == 'success' && (needs.build-server.result == 'success' || needs.build-server.result == 'skipped') && (needs.build-agents.result == 'success' || needs.build-agents.result == 'skipped') && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: azure/setup-kubectl@v4

      - run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - run: kubectl apply -f k8s/

      - run: |
          if [[ "${{ needs.changes.outputs.server }}" == "true" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kubectl -n remolt set image deployment/remolt-server \
              server=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/remolt-server:${{ github.sha }}
            kubectl -n remolt rollout status deployment/remolt-server --timeout=300s
          fi
